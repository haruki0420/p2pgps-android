name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APKs and attach to release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;37.0.0" "platform-tools" > /dev/null

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "error: ANDROID_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Build debug and signed release APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "Stamping versionName=$VERSION versionCode=$VERSION_CODE"
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$VERSION_CODE"

      - name: Verify release APK signature
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Rename and checksum
        run: |
          set -euo pipefail
          DEBUG_APK="p2pgps-android-${{ inputs.tag }}-debug.apk"
          RELEASE_APK="p2pgps-android-${{ inputs.tag }}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$DEBUG_APK"
          cp app/build/outputs/apk/release/app-release.apk "$RELEASE_APK"
          sha256sum "$DEBUG_APK" "$RELEASE_APK" | tee checksums.sha256
          ls -lh "$DEBUG_APK" "$RELEASE_APK"

      - name: Upload APKs to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEBUG_APK="p2pgps-android-${{ inputs.tag }}-debug.apk"
          RELEASE_APK="p2pgps-android-${{ inputs.tag }}-release.apk"
          gh release upload "${{ inputs.tag }}" "$DEBUG_APK" "$RELEASE_APK" checksums.sha256 --clobber
